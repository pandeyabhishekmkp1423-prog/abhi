    <text x="445" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">कृषि उपकरण (Tools)</text>
    <rect x="580" y="53" width="75" height="24" rx="4" fill="#16A34A" />
    <text x="592" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">हिंदी सक्रिय</text>

    <!-- Sub-header Category Bar -->
    <rect x="0" y="88" width="680" height="36" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="30" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#2563EB">सभी श्रेणियां (All Categories)</text>
    <text x="200" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">ट्रैक्टर व हल (Tractors)</text>
    <text x="330" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">मिस्त्री व कारीगर (Masons)</text>
    <text x="470" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">बिजली व सोलर (Solar)</text>

