    <g transform="translate(25, 140)">
      <!-- Listing 1 -->
      <g>
        <rect x="0" y="0" width="200" height="245" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <rect x="15" y="15" width="170" height="85" rx="4" fill="#EFF6FF" stroke="#BFDBFE" />
        <circle cx="100" cy="55" r="22" fill="#2563EB" opacity="0.15" />
        <text x="75" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2563EB">🚜 किराया</text>

