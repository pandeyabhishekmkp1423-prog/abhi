        <text x="15" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#071327">मोटर व ट्यूबवेल मरम्मत</text>
        <text x="15" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">Submersible & Wiring Service</text>
        <text x="15" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#16A34A" font-weight="600">उपलब्ध: दिनेश कुमार (सलोन ब्लॉक)</text>
        <text x="15" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#071327">दर: काम अनुसार</text>

        <rect x="15" y="202" width="170" height="28" rx="4" fill="#16A34A" />
        <text x="50" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">📞 सीधे बात करें (Call)</text>
      </g>

      <!-- Listing 3 -->
      <g transform="translate(430, 0)">
        <rect x="0" y="0" width="200" height="245" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <rect x="15" y="15" width="170" height="85" rx="4" fill="#DCFCE7" stroke="#BBF7D0" />
        <circle cx="100" cy="55" r="22" fill="#16A34A" opacity="0.15" />
        <text x="75" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#16A34A">🌾 जैविक खाद</text>

        <text x="15" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#071327">शुद्ध वर्मीकम्पोस्ट खाद</text>
        <text x="15" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">Organic Vermicompost 50kg Bags</text>
        <text x="15" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#16A34A" font-weight="600">उपलब्ध: किसान उत्पादक समूह</text>
        <text x="15" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#071327">₹350 / बोरी</text>

        <rect x="15" y="202" width="170" height="28" rx="4" fill="#16A34A" />
        <text x="50" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">📞 सीधे बात करें (Call)</text>
