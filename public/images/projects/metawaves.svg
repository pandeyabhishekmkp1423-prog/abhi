<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#071327" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- App Window Container -->
  <g filter="url(#shadow)" transform="translate(60, 45)">
    <rect width="680" height="410" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="680" height="42" rx="10" fill="#F8FAFC" />
    <path d="M 0 42 L 680 42" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" opacity="0.75" />
    <circle cx="40" cy="21" r="5" fill="#F59E0B" opacity="0.75" />
    <circle cx="56" cy="21" r="5" fill="#10B981" opacity="0.75" />
    <rect x="84" y="11" width="220" height="20" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="96" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">metawaves.lms/learn/modules</text>

    <!-- Sidebar -->
    <rect x="0" y="42" width="170" height="368" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="18" y="65" width="134" height="28" rx="6" fill="#EFF6FF" />
    <rect x="26" y="73" width="12" height="12" rx="3" fill="#2563EB" />
    <rect x="46" y="75" width="80" height="8" rx="2" fill="#2563EB" />

    <rect x="26" y="115" width="12" height="12" rx="3" fill="#94A3B8" />
    <rect x="46" y="117" width="90" height="8" rx="2" fill="#94A3B8" />
    <rect x="26" y="145" width="12" height="12" rx="3" fill="#94A3B8" />
    <rect x="46" y="147" width="70" height="8" rx="2" fill="#94A3B8" />
    <rect x="26" y="175" width="12" height="12" rx="3" fill="#94A3B8" />
    <rect x="46" y="177" width="85" height="8" rx="2" fill="#94A3B8" />

    <!-- Main Content Area -->
    <g transform="translate(190, 60)">
      <!-- Top Stats Bar -->
      <rect x="0" y="0" width="465" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#071327">Course Dashboard: Advanced Systems Engineering</text>
      <text x="16" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">Enrollment: Active · 14 Modules Completed</text>
      <rect x="365" y="12" width="85" height="24" rx="4" fill="url(#blueGrad)" />
      <text x="382" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#FFFFFF">Resume</text>

      <!-- Video / Lesson Viewer Simulation -->
      <rect x="0" y="62" width="310" height="180" rx="8" fill="#071327" />
      <circle cx="155" cy="152" r="22" fill="#2563EB" />
      <polygon points="152,144 163,152 152,160" fill="#FFFFFF" />
      <rect x="16" y="222" width="140" height="8" rx="4" fill="#3B82F6" />
      <rect x="160" y="222" width="134" height="8" rx="4" fill="#334155" />

      <!-- Progress Card -->
      <rect x="325" y="62" width="140" height="180" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="337" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#071327">Curriculum</text>
      <circle cx="395" cy="140" r="36" fill="none" stroke="#EFF6FF" stroke-width="8" />
      <circle cx="395" cy="140" r="36" fill="none" stroke="#2563EB" stroke-width="8" stroke-dasharray="160 230" stroke-linecap="round" />
      <text x="384" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#071327">78%</text>
      <text x="342" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">12/16 Lessons Done</text>
      <rect x="337" y="212" width="116" height="18" rx="4" fill="#EFF6FF" />
      <text x="350" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#2563EB">View Syllabus</text>

      <!-- Bottom Module Grid -->
      <g transform="translate(0, 256)">
        <rect x="0" y="0" width="145" height="74" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <rect x="10" y="12" width="70" height="8" rx="2" fill="#2563EB" />
        <rect x="10" y="28" width="115" height="6" rx="2" fill="#94A3B8" />
        <rect x="10" y="40" width="90" height="6" rx="2" fill="#CBD5E1" />
        <circle cx="125" cy="16" r="6" fill="#10B981" />

        <rect x="160" y="0" width="145" height="74" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <rect x="170" y="12" width="80" height="8" rx="2" fill="#2563EB" />
        <rect x="170" y="28" width="115" height="6" rx="2" fill="#94A3B8" />
        <rect x="170" y="40" width="75" height="6" rx="2" fill="#CBD5E1" />
        <circle cx="285" cy="16" r="6" fill="#10B981" />

        <rect x="320" y="0" width="145" height="74" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <rect x="330" y="12" width="75" height="8" rx="2" fill="#64748B" />
        <rect x="330" y="28" width="115" height="6" rx="2" fill="#94A3B8" />
        <rect x="330" y="40" width="60" height="6" rx="2" fill="#CBD5E1" />
        <circle cx="445" cy="16" r="6" fill="#94A3B8" />
      </g>
    </g>
  </g>
</svg>
