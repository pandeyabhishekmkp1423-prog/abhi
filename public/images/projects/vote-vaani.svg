<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#071327" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#vvGrad)" />

  <g filter="url(#shadow)" transform="translate(60, 45)">
    <rect width="680" height="410" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Browser Bar -->
    <rect width="680" height="42" rx="10" fill="#F8FAFC" />
    <path d="M 0 42 L 680 42" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" opacity="0.75" />
    <circle cx="40" cy="21" r="5" fill="#F59E0B" opacity="0.75" />
    <circle cx="56" cy="21" r="5" fill="#10B981" opacity="0.75" />
    <rect x="84" y="11" width="220" height="20" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="96" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">votevaani.org/constituency/polls</text>

    <!-- Top Header -->
    <rect x="0" y="42" width="680" height="46" fill="#071327" />
    <text x="25" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Vote Vaani · Civic Platform</text>
    <text x="400" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">Constituencies</text>
    <text x="490" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">Candidate Info</text>
    <rect x="585" y="53" width="70" height="24" rx="4" fill="#2563EB" />
    <text x="600" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">हिंदी / ENG</text>

    <!-- Main Civic Content -->
    <g transform="translate(30, 105)">
      <!-- Left Poll Section -->
      <rect x="0" y="0" width="370" height="280" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <rect x="20" y="20" width="90" height="20" rx="10" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="32" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#2563EB">VERIFIED POLL</text>

      <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#071327">Primary Civic Priorities for Constituency 2024</text>
      <text x="20" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">Select the development issue needing urgent municipal attention:</text>

      <!-- Poll Options -->
      <g transform="translate(20, 100)">
        <rect x="0" y="0" width="330" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
        <rect x="0" y="0" width="165" height="38" rx="6" fill="#EFF6FF" opacity="0.6" />
        <text x="16" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#071327">Clean Drinking Water & Drainage Infrastructure</text>
        <text x="285" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#2563EB">50%</text>

        <rect x="0" y="48" width="330" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
        <rect x="0" y="48" width="99" height="38" rx="6" fill="#EFF6FF" opacity="0.6" />
        <text x="16" y="71" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#071327">Primary Healthcare Center Staffing</text>
        <text x="285" y="71" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#2563EB">30%</text>

        <rect x="0" y="96" width="330" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
        <rect x="0" y="96" width="66" height="38" rx="6" fill="#EFF6FF" opacity="0.6" />
        <text x="16" y="119" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#071327">Local Rural Road Connectivity</text>
        <text x="285" y="119" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#2563EB">20%</text>
      </g>

      <text x="20" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8">Session rate-limiting active · Verified IP hashes only</text>

      <!-- Right Column: Constituency Details -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="230" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#071327">Electoral District Facts</text>
        <text x="16" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">Polling Booths: 342 Registered</text>
        <text x="16" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">Voter Turnout (Last Cycle): 67.8%</text>
        <text x="16" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">Electoral Officer Helpline: Active</text>
        <rect x="16" y="102" width="198" height="20" rx="4" fill="#EFF6FF" />
        <text x="45" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#2563EB">View Booth Map</text>

        <rect x="0" y="145" width="230" height="135" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="16" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#071327">Voter Information Guide</text>
        <text x="16" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">1. Verify name in electoral roll</text>
        <text x="16" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">2. Valid photo ID requirements</text>
        <text x="16" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">3. Accessible booth arrangements</text>
        <rect x="16" y="242" width="198" height="22" rx="4" fill="#2563EB" />
        <text x="60" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Read Guide (PDF)</text>
      </g>
    </g>
  </g>
</svg>
